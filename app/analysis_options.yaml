# flutter_lints (Flutter's recommended set) plus a few stricter rules that catch real bugs in app
# code. very_good_analysis was considered: it also demands doc comments on every public member and
# other style rules that add noise to an app (as opposed to a published package).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "packages/**"
    - "lib/l10n/app_localizations*.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
