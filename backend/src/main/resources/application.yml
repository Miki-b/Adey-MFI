# Main configuration. Every value can be overridden by an environment variable:
# ${NAME:default} means "use env var NAME if set, otherwise the default".

spring:
  application:
    name: mfi-backend
  profiles:
    # Used only when no profile is chosen explicitly (SPRING_PROFILES_ACTIVE).
    # Production must set SPRING_PROFILES_ACTIVE to something else (e.g. "prod").
    default: local
  mvc:
    # Spring's built-in errors (400 for bad JSON, 404, ...) also use RFC 7807 ProblemDetail.
    problemdetails:
      enabled: true
  # Our own database: refresh tokens + audit log. Separate from Fineract's databases.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/adey_backend}
    username: ${DB_USERNAME:adey}
    password: ${DB_PASSWORD:adey}
    hikari:
      maximum-pool-size: 5
  jpa:
    # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
    hibernate:
      ddl-auto: validate
    # Don't keep a DB connection open while the HTTP response is rendered.
    open-in-view: false
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # 0.0.0.0 = listen on every network interface (so a phone on the same Wi-Fi can connect).
  # Set SERVER_ADDRESS=127.0.0.1 to accept connections from this computer only.
  address: ${SERVER_ADDRESS:0.0.0.0}

fineract:
  base-url: ${FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api/v1}
  tenant: ${FINERACT_TENANT:default}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
  connect-timeout: ${FINERACT_CONNECT_TIMEOUT:5s}
  read-timeout: ${FINERACT_READ_TIMEOUT:30s}
  # Secure by default. Only application-local.yml switches this on.
  trust-self-signed-certificate: false

app:
  security:
    login:
      # Login rate limit (in memory): this many failures per username or IP within the window -> 429.
      max-failures: 5
      window: 15m
    jwt:
      # HMAC key that signs our access tokens. MUST come from the JWT_SECRET environment variable
      # outside local development (32+ characters). Empty here, so a non-local start without it fails.
      secret: ${JWT_SECRET:}
      issuer: adey-mfi-backend
      access-token-ttl: 15m
    refresh-token-ttl: 7d
    # Swagger UI / OpenAPI / health reachable without a token. Only the local profile sets true.
    public-docs: false
  cors:
    # Browser origins allowed to call /api/**. Empty = no cross-origin browser access.
    allowed-origins: []
  # Mobile money. provider picks the adapter: simulator (TelePay simulator) or chapa (Chapa test mode).
  # TelePay settings below have no defaults here: with provider=simulator outside the local profile
  # they MUST be set through environment variables, or startup fails.
  mobile-money:
    provider: ${MOBILE_MONEY_PROVIDER:simulator}
    provider-base-url: ${TELEPAY_BASE_URL:}
    api-key: ${TELEPAY_API_KEY:}
    # Shared secret for webhook signatures (HMAC-SHA256), 32+ characters.
    webhook-secret: ${MOBILE_MONEY_WEBHOOK_SECRET:}
    # Our public webhook URL, given to the provider with every charge.
    callback-url: ${MOBILE_MONEY_CALLBACK_URL:}
    timestamp-tolerance: 5m
    payment-type-name: Mobile Money
    posting:
      poll-interval: 5s
      max-attempts: 8
      base-delay: 10s
      max-delay: 2m
    # Chapa only: check PENDING payments with Chapa's verify API (webhooks are only hints there).
    # First check 10s after the charge, then 5s, 10s, 20s, ... capped at 2m; NEEDS_ATTENTION after 20 checks.
    verify:
      polling-enabled: ${MOBILE_MONEY_VERIFY_POLLING:true}
      poll-interval: 5s
      first-check-after: 10s
      max-attempts: 20
      base-delay: 5s
      max-delay: 2m
  # Chapa (used only with app.mobile-money.provider=chapa). TEST keys only: the provider refuses
  # anything that doesn't start with CHASECK_TEST-. Never commit or log these values.
  chapa:
    base-url: https://api.chapa.co/v1
    secret-key: ${CHAPA_SECRET_KEY:}
    # The "secret hash" also entered in Chapa's dashboard (Webhooks). Empty = all webhooks refused.
    webhook-secret: ${CHAPA_WEBHOOK_SECRET:}
  reconciliation:
    # Every night at 00:30 Addis Ababa time, for the previous day.
    cron: "0 30 0 * * *"
  simulator:
    # The built-in TelePay simulator (/sim/**) exists only in the local profile.
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # Stable output for backend/openapi.json: sorted keys, pretty-printed.
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
